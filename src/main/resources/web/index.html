<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>KubePulse Studio Dashboard</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0d1117;
            color: #c9d1d9;
            margin: 0;
            padding: 20px;
        }
        h1 { color: #58a6ff; }
        .card {
            background-color: #161b22;
            border: 1px solid #30363d;
            border-radius: 6px;
            padding: 20px;
            margin-bottom: 20px;
        }
        button {
            background-color: #238636;
            color: white;
            border: none;
            padding: 10px 18px;
            font-size: 14px;
            border-radius: 6px;
            cursor: pointer;
            margin-right: 10px;
        }
        button:hover { background-color: #2ea043; }
        .btn-danger { background-color: #da3633; }
        .btn-danger:hover { background-color: #f85149; }
        input[type="text"] {
            padding: 8px;
            width: 300px;
            background-color: #0d1117;
            border: 1px solid #30363d;
            color: white;
            border-radius: 4px;
            margin-right: 10px;
        }
    </style>
</head>
<body>

    <h1>🚀 KubePulse Studio - DevOps Control Center</h1>
    
    <div class="card">
        <h3>Repository & Zero-Click Pipeline</h3>
        <input type="text" id="repoUrl" placeholder="https://github.com/username/repo.git" value="https://github.com/sample/my-app.git">
        <button onclick="startDeploy()">Deploy Now (Zero-Click)</button>
    </div>

    <div class="card">
        <h3>Infrastructure & Operations</h3>
        <button onclick="runTerraform()">Run Terraform Apply</button>
        <button class="btn-danger" onclick="rollbackK8s()">1-Click K8s Rollback</button>
    </div>

    <div class="card">
        <h3>Live Terminal Logs</h3>
        <pre id="logs" style="background: #010409; padding: 15px; border-radius: 4px; height: 150px; overflow-y: scroll; color: #7ee787;">Waiting for pipeline trigger...</pre>
    </div>

    <script>
        function startDeploy() {
            const url = document.getElementById('repoUrl').value;
            document.getElementById('logs').innerText += "\n[INFO] Triggering pipeline for: " + url;
            window.javaBridge.triggerDeployment(url);
        }

        function runTerraform() {
            document.getElementById('logs').innerText += "\n[INFO] Initializing Terraform provisioning...";
            window.javaBridge.runTerraformApply();
        }

        function rollbackK8s() {
            document.getElementById('logs').innerText += "\n[WARNING] Rolling back Kubernetes deployment...";
            window.javaBridge.runK8sRollback();
        }
    </script>
</body>
</html>
