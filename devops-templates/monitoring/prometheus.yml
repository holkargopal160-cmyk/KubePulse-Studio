global:
  scrape_interval: 15s # By default, scrape targets every 15 seconds.

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'kubepulse-app-server'
    static_configs:
      - targets: ['192.168.1.50:8080'] # Aapke target application ka IP aur port