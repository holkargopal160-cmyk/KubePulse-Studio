apiVersion: apps/v1
kind: Deployment
metadata:
  name: kubepulse-app-deployment
  labels:
    app: kubepulse-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: kubepulse-app
  template:
    metadata:
      labels:
        app: kubepulse-app
    spec:
      containers:
      - name: my-app
        image: my-app-image:latest
        ports:
        - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: kubepulse-app-service
spec:
  type: NodePort
  selector:
    app: kubepulse-app
  ports:
    - port: 80
      targetPort: 8080
      nodePort: 30007