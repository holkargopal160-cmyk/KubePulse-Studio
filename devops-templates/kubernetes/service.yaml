apiVersion: v1
kind: Service
metadata:
  name: kubepulse-app-service
  labels:
    app: kubepulse-app
spec:
  type: NodePort
  selector:
    app: kubepulse-app
  ports:
    - protocol: TCP
      port: 80           # Service port jo cluster ke andar expose hoga
      targetPort: 8080   # Container ke andar app ka port
      nodePort: 30007    # External browser access port